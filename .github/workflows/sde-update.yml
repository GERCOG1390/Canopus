name: Auto Update EVE SDE

on:
  schedule:
    # Runs automatically every Tuesday & Thursday at 12:00 UTC (after CCP game updates)
    - cron: '0 12 * * 2,4'
  workflow_dispatch: # Allows manual trigger from GitHub Actions web page

permissions:
  contents: write  # required for softprops/action-gh-release to create/update the release

jobs:
  build-and-update-sde:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode with Swift 6 toolchain
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Find CCP's latest SDE build
        id: ccp
        run: |
          set -euo pipefail
          # The legacy S3 export (eve-static-data-export…/sde.zip) stopped updating in July 2025; the
          # official SDE is on developers.eveonline.com, with its build number in latest.jsonl.
          BUILD=$(curl -fsSL https://developers.eveonline.com/static-data/tranquility/latest.jsonl | head -1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["buildNumber"])')
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          PREVIOUS=$(curl -fsSL "https://github.com/${{ github.repository }}/releases/download/sde-latest/canopus-sde-manifest.json" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("ccp_build", ""))' || true)
          echo "CCP build $BUILD, released package built from '${PREVIOUS}'"
          if [ "$BUILD" = "$PREVIOUS" ] && [ "${{ github.event_name }}" = "schedule" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download the SDE from the CCP developers portal
        if: steps.ccp.outputs.skip != 'true'
        run: |
          set -euo pipefail
          curl -fL -o ccp_sde.zip "https://developers.eveonline.com/static-data/tranquility/eve-online-static-data-${{ steps.ccp.outputs.build }}-yaml.zip"
          mkdir -p sde_extracted
          unzip -q ccp_sde.zip -d sde_extracted
          test -f sde_extracted/types.yaml # fail loudly rather than feed sde-import an unexpected layout

      - name: Download previous release (for changelog diffing)
        if: steps.ccp.outputs.skip != 'true'
        run: |
          # Best-effort — absent on the very first run, or if nothing was ever released.
          curl -fL -o previous_sde.sqlite \
            "https://github.com/${{ github.repository }}/releases/download/sde-latest/canopus_sde.sqlite" \
            || echo "No previous release found — changelog will be skipped for this run."

      - name: Convert SDE to Canopus SQLite format
        if: steps.ccp.outputs.skip != 'true'
        run: |
          echo "Running sde-import..."
          PREVIOUS_ARGS=""
          if [ -f previous_sde.sqlite ]; then
            PREVIOUS_ARGS="--previous previous_sde.sqlite"
          fi
          swift run --package-path Tools/sde-import sde-import \
            --input sde_extracted \
            --output canopus_sde.sqlite \
            --manifest canopus-sde-manifest.json \
            --package-url "https://github.com/${{ github.repository }}/releases/download/sde-latest/canopus_sde.sqlite" \
            $PREVIOUS_ARGS

      - name: Upload SDE to GitHub Release
        if: steps.ccp.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "sde-latest"
          name: "Latest EVE Online SDE Database"
          body: "Automated build of the EVE Online SDE (CCP build ${{ steps.ccp.outputs.build }}) as SQLite for Canopus."
          files: |
            canopus_sde.sqlite
            canopus-sde-manifest.json
            canopus-sde-changelog.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
